# Tiny Tapeout project information
project:
  title:        "Temporal Protocol Machine"      # Project title
  author:       ""      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "An open-source waveform translator. After fabrication, loaded weights and tables make the same pins speak a new temporal line code or a familiar one such as UART, SPI, or I2C. A reservoir and a second listener emit timestamped symbols, including an unrecognized-wiggle mark. A core and a reflex table reply with waveforms."
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_example"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "MOSI"
  ui[1]: "CS"
  ui[2]: "SCK"
  ui[3]: "extra protocol in / debug"
  ui[4]: "extra protocol in / debug"
  ui[5]: "extra protocol in / debug"
  ui[6]: "extra protocol in / debug"
  ui[7]: "extra protocol in / debug"

  # Outputs
  uo[0]: "MISO"
  uo[1]: "extra protocol out / debug"
  uo[2]: "extra protocol out / debug"
  uo[3]: "extra protocol out / debug"
  uo[4]: "extra protocol out / debug"
  uo[5]: "extra protocol out / debug"
  uo[6]: "extra protocol out / debug"
  uo[7]: "extra protocol out / debug"

  # Bidirectional pins
  uio[0]: "bidirectional protocol pin"
  uio[1]: "bidirectional protocol pin"
  uio[2]: "bidirectional protocol pin"
  uio[3]: "bidirectional protocol pin"
  uio[4]: "bidirectional protocol pin"
  uio[5]: "bidirectional protocol pin"
  uio[6]: "bidirectional protocol pin"
  uio[7]: "bidirectional protocol pin"

# Do not change!
yaml_version: 6
